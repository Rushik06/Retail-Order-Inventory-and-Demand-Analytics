events {}

http {

  # ----------- FRONTEND -----------
  upstream frontend {
    server web-app:80;   
  }

  # ----------- BACKENDS -----------
  upstream auth_backend {
    server auth-service:3000;
  }

  upstream product_backend {
    server product-service:3001;
  }

  upstream inventory_backend {
    server inventory-service:3002;
  }

  upstream reporting_backend {
    server reporting-service:3003;
  }

  server {
    listen 80;

    # ----------- FRONTEND -----------
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # React routing fallback handled by web-app nginx
    }

    # ----------- AUTH -----------
    location /api/auth/ {
      proxy_pass http://auth_backend;
    }

    location /api/password/ {
      proxy_pass http://auth_backend;
    }

    location /api/profile/ {
      proxy_pass http://auth_backend;
    }

    location /api/rbac/ {
      proxy_pass http://auth_backend;
    }

    # ----------- INVENTORY -----------
    location /api/inventory/ {
      proxy_pass http://inventory_backend;
    }

    location /api/warehouse/ {
      proxy_pass http://inventory_backend;
    }

    # ----------- REPORTING -----------
    location /api/reports/ {
      proxy_pass http://reporting_backend;
    }

    # ----------- PRODUCT (DEFAULT) -----------
    location /api/ {
      proxy_pass http://product_backend;
    }

    # ----------- COMMON HEADERS -----------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}