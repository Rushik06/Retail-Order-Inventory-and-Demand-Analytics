events {}

http {

  # FRONTEND 
  upstream frontend {
    server web-app:80;
  }

  # BACKENDS 
  upstream auth_backend {
    server auth-service:3000;
  }

  upstream product_backend {
    server product-service:3001;
  }

  upstream inventory_backend {
    server inventory-service:3002;
  }

  upstream reporting_backend {
    server reporting-service:3003;
  }

  server {
    listen 80;

    # WEBSOCKET 
    location /socket.io/ {
      proxy_pass http://inventory_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
    }

    # FRONTEND 
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # AUTH 
    location /api/v1/auth {
      proxy_pass http://auth_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/password {
      proxy_pass http://auth_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/profile {
      proxy_pass http://auth_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/rbac {
      proxy_pass http://auth_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # INVENTORY 
    location /api/v1/inventory {
      proxy_pass http://inventory_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/warehouse {
      proxy_pass http://inventory_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # REPORTING
    location /api/v1/reports {
      proxy_pass http://reporting_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # PRODUCT 
    location /api/v1/ {
      proxy_pass http://product_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}